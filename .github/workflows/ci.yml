name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: fast
            timeout: 10
          - tier: playtest
            timeout: 10
          - tier: long
            timeout: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run ${{ matrix.tier }} tests
        run: npm run test:${{ matrix.tier }}
      - name: Build
        if: matrix.tier == 'fast'
        run: npm run build
