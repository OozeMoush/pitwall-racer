<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pitwall Racer — 2台テスト</title>
<style>body{margin:0;background:#10171c;color:#e7eef2;font:16px system-ui}header{padding:12px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}header p{margin:0;font-size:14px}select{padding:8px;background:#23343e;color:#e7eef2;border:1px solid #73838e;border-radius:4px}button{padding:9px 16px;border:0;border-radius:5px;background:#a7e8cf;color:#10241c;cursor:pointer}canvas{display:block;width:100%;height:calc(100vh - 150px);min-height:300px;background:#233b2c}output{display:block;padding:12px 20px;line-height:1.6;font-variant-numeric:tabular-nums}a{color:#a7e8cf}</style></head>
<body><header><strong>CPU 並走テスト（2台）</strong><button id="start" disabled>読み込み中</button><button id="reset" disabled>リセット</button><label>候補 <select id="policy"><option value="defense">守備への反応あり</option><option value="corridor">旧候補（比較）</option></select></label><label>開始場面 <select id="scenario"><option value="defence">直線で守る</option><option value="mistake">コーナー手前の減速ミス</option><option value="overlap">並走でコーナーへ</option></select></label><a href="/">通常ゲームへ</a><p>W/S：アクセル／ブレーキ　A/D：ハンドル　P：一時停止　R：リセット<br>青＝自分、黄＝CPU。車体は実際に衝突します。黄の点＝CPUの目標進路。早めに塞ぐ／空いた側を残す／並走の幅を保つ、を比較してください。</p></header><canvas id="lab"></canvas><output id="status">初期化中</output><script type="module" src="/src/experiments/PassingLab.ts"></script></body></html>
